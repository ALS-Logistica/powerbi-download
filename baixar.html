<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nenhuma conexão de rede é permitida: os dados chegam depois do "#" (que o navegador não envia a ninguém) e o arquivo é montado aqui mesmo -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Baixar arquivo · Power BI</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #071E38;
         font-family: "Segoe UI", system-ui, sans-serif; color: #FFFFFF; }
  .card { width: min(460px, calc(100vw - 32px)); box-sizing: border-box; padding: 26px 28px; border-radius: 14px;
          background: linear-gradient(160deg, #0D2E55, #0A2342); border: 1px solid rgba(84, 181, 251, .16); box-shadow: 0 8px 24px rgba(0, 0, 0, .35); }
  .logo { display: flex; align-items: flex-end; gap: 3px; height: 22px; margin-bottom: 14px; }
  .logo i { width: 6px; border-radius: 2px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 13px; color: #A8D4F5; margin: 4px 0; line-height: 1.5; word-break: break-word; }
  .ok { color: #00FF18; } .erro { color: #FF5C7A; }
  button { margin-top: 16px; font: inherit; font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: none;
           cursor: pointer; background: #00DDFF; color: #0A2342; }
  small { display: block; margin-top: 14px; font-size: 11px; color: #6B7A8D; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><i style="height:10px;background:#0B72D7"></i><i style="height:16px;background:#54B5FB"></i><i style="height:22px;background:#00DDFF"></i></div>
  <h1 id="tit">Preparando o arquivo…</h1>
  <p id="msg"></p>
  <button id="de-novo" type="button" hidden>⭳ Baixar de novo</button>
  <small>Os dados vieram do relatório direto para esta aba, no seu computador; nada é enviado pela internet. Pode fechar esta aba depois do download.</small>
</div>
<script>
(function () {
  "use strict";
  var tit = document.getElementById("tit"), msg = document.getElementById("msg"), btn = document.getElementById("de-novo");
  function erro(t) { tit.textContent = "Não foi possível montar o arquivo"; tit.className = "erro"; msg.textContent = t; }

  // lê os dados e já tira do endereço (não ficam na barra nem num "recarregar")
  var hash = location.hash.slice(1);
  if (hash) history.replaceState(null, "", location.pathname);
  var p = {};
  hash.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) p[kv.slice(0, i)] = kv.slice(i + 1); });
  if (!p.z && !(p.zp && p.i)) {
    tit.textContent = "Download dos relatórios Power BI";
    msg.textContent = "Esta página é aberta pelo botão Exportar CSV dos relatórios. Volte ao relatório e clique em Exportar.";
    return;
  }

  var nome = "exportacao.csv";
  try { nome = decodeURIComponent(p.n || nome).replace(/[\\/:*?"<>|]+/g, "_") || nome; } catch (e) { /* nome padrão */ }

  function bytesDe(b64url) {
    var b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function texto(gz) { return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text(); }
  function tamanho(n) { return n / 1024 < 1024 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1).replace(".", ",") + " MB"; }

  var url = null;
  function baixar() {
    var a = document.createElement("a");
    a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  }
  function entregar(blob, extra) {
    var tipo = /\.pdf$/i.test(nome) ? "application/pdf" : "text/csv;charset=utf-8";
    url = URL.createObjectURL(new Blob([blob], { type: tipo }));
    baixar();
    tit.textContent = "✓ Download iniciado"; tit.className = "ok";
    msg.textContent = nome + " · " + tamanho(blob.size) + (extra || "");
    btn.hidden = false;
    btn.onclick = baixar;
  }

  if (typeof DecompressionStream === "undefined") { erro("Este navegador não conseguiu abrir o arquivo. Use o Chrome ou o Edge atualizados."); return; }

  // ---------------- um arquivo inteiro no endereço (como sempre foi) ----------------
  if (!p.i) {
    new Response(new Blob([bytesDe(p.z)]).stream().pipeThrough(new DecompressionStream("gzip"))).blob()
      .then(function (blob) { entregar(blob); })
      .catch(function () { erro("O conteúdo chegou incompleto. Volte ao relatório e clique em Exportar de novo."); });
    return;
  }

  // ---------------- arquivo grande: várias partes, UM arquivo no fim ----------------
  // O relatório abre a parte 1 nesta aba. Esta aba pede o resto direto ao relatório (mensagem entre janelas, sem
  // internet); se não der, o relatório abre uma aba por parte, cada uma guarda a sua parte neste navegador e esta aba
  // junta tudo num arquivo só.
  var id = p.i, k = parseInt(p.k, 10) || 1, total = parseInt(p.t, 10) || 1;
  if (!/^[a-z0-9]{8,64}$/i.test(id)) { erro("Endereço inválido. Volte ao relatório e clique em Exportar de novo."); return; }

  function abrirBanco() {
    return new Promise(function (ok, falha) {
      var r = indexedDB.open("powerbi-download", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("partes"); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { falha(r.error); };
    });
  }
  function guardar(db, chave, valor) {
    return new Promise(function (ok, falha) {
      var tx = db.transaction("partes", "readwrite"); tx.objectStore("partes").put(valor, chave);
      tx.oncomplete = function () { ok(); }; tx.onerror = function () { falha(tx.error); };
    });
  }
  function lerTodas(db) {
    return new Promise(function (ok, falha) {
      var out = {}, tx = db.transaction("partes", "readonly"), req = tx.objectStore("partes").openCursor();
      req.onsuccess = function () { var c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = function () { ok(out); }; tx.onerror = function () { falha(tx.error); };
    });
  }
  function apagar(db, filtro) {
    return lerTodas(db).then(function (todas) {
      var tx = db.transaction("partes", "readwrite"), st = tx.objectStore("partes");
      Object.keys(todas).forEach(function (c) { if (filtro(c, todas[c])) st.delete(c); });
    });
  }

  // junta as partes: o cabeçalho (e o BOM) só da primeira
  function montar(gzs) {
    return Promise.all(gzs.map(texto)).then(function (txts) {
      var corpo = txts.map(function (t, n) {
        if (n === 0) return t.replace(/[\r\n]+$/, "");
        t = t.replace(/^﻿/, "");
        var q = t.indexOf("\n");
        return q < 0 ? "" : t.slice(q + 1).replace(/[\r\n]+$/, "");
      }).filter(function (t) { return t.length; });
      return new Blob([corpo.join("\r\n")]);
    });
  }

  var meu = bytesDe(p.zp || p.z);
  abrirBanco().then(function (db) {
    var agora = Date.now();
    // limpa sobras de exportações antigas (mais de 1 hora)
    return apagar(db, function (c, v) { return !v || agora - v.ts > 3600000; })
      .then(function () { return guardar(db, id + "#" + k, { ts: agora, gz: meu }); })
      .then(function () { return db; });
  }).then(function (db) {
    if (k > 1) {
      tit.textContent = "✓ Parte " + k + " de " + total + " recebida"; tit.className = "ok";
      msg.textContent = "O arquivo completo é montado e baixado na primeira aba. Esta aba fecha sozinha.";
      setTimeout(function () { window.close(); }, 2500);
      return;
    }
    tit.textContent = "Juntando as partes…";
    var pronto = false;
    function concluir(gzs, origem) {
      if (pronto) return;
      pronto = true;
      montar(gzs).then(function (blob) {
        entregar(blob, " · " + total + " partes juntadas em 1 arquivo");
        apagar(db, function (c) { return c.indexOf(id + "#") === 0; });
      }).catch(function () { erro("Não foi possível juntar as partes. Volte ao relatório e clique em Exportar de novo."); });
    }

    // 1) pede o resto direto ao relatório (a resposta só vale para este id, gerado no relatório a cada exportação)
    window.addEventListener("message", function (e) {
      var d = e.data;
      if (!d || d.tipo !== "pbi-dl-dados" || d.id !== id || !d.partes || d.partes.length !== total) return;
      concluir(d.partes.map(function (x) { return new Uint8Array(x); }), "relatório");
    });
    function pedir(w, prof) {
      if (!w || prof > 8) return;
      try { w.postMessage({ tipo: "pbi-dl-pedido", id: id }, "*"); } catch (e) { /* janela inacessível */ }
      var n = 0;
      try { n = w.frames.length; } catch (e) { n = 0; }
      for (var f = 0; f < n; f++) { try { pedir(w.frames[f], prof + 1); } catch (e) { /* segue */ } }
    }
    try { pedir(window.opener, 0); } catch (e) { /* sem janela de origem */ }

    // 2) espera as outras abas guardarem as suas partes
    var ini = Date.now();
    (function esperar() {
      if (pronto) return;
      lerTodas(db).then(function (todas) {
        if (pronto) return;
        var gzs = [], tem = 0;
        for (var n = 1; n <= total; n++) { var v = todas[id + "#" + n]; if (v) { tem++; gzs.push(v.gz); } }
        if (tem === total) { concluir(gzs, "abas"); return; }
        msg.textContent = "Recebidas " + tem + " de " + total + " partes…";
        if (Date.now() - ini < 45000) { setTimeout(esperar, 400); return; }
        erro("Chegaram só " + tem + " de " + total + " partes: o navegador bloqueou as outras abas. Permita os pop-ups do portal " +
             "(ícone na barra de endereço → \"Sempre permitir\") e clique em Exportar de novo.");
      });
    })();
  }).catch(function () {
    erro("O navegador não deixou guardar os dados nesta aba (modo anônimo ou armazenamento bloqueado). Tente numa janela normal.");
  });
})();
</script>
</body>
</html>
